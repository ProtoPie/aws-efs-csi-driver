---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: efsnamespaces.efs.csi.aws.com
spec:
  group: efs.csi.aws.com
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        description: EFSNamespace represents a mapping between a Kubernetes namespace and an AWS EFS filesystem
        type: object
        required:
        - spec
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation of an object'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this object represents'
            type: string
          metadata:
            type: object
          spec:
            description: EFSNamespaceSpec defines the desired state of EFSNamespace
            type: object
            required:
            - namespace
            - region
            properties:
              namespace:
                description: The Kubernetes namespace to map to an EFS filesystem
                type: string
                minLength: 1
                maxLength: 63
                pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
              fileSystemId:
                description: The AWS EFS filesystem ID (optional - will be auto-created if not specified)
                type: string
                pattern: '^fs-[0-9a-f]{8,40}$'
              fileSystemArn:
                description: The ARN of the EFS filesystem
                type: string
                pattern: '^arn:aws[a-z-]*:elasticfilesystem:[a-z0-9-]+:[0-9]{12}:file-system/fs-[0-9a-f]{8,40}$'
              region:
                description: AWS region where the EFS filesystem exists or will be created
                type: string
                pattern: '^[a-z]{2}-[a-z]+-[0-9]{1}$'
              performanceMode:
                description: Performance mode of the EFS filesystem
                type: string
                enum:
                - generalPurpose
                - maxIO
                default: generalPurpose
              throughputMode:
                description: Throughput mode of the EFS filesystem
                type: string
                enum:
                - bursting
                - provisioned
                - elastic
                default: bursting
              provisionedThroughputInMibps:
                description: Provisioned throughput in MiB/s (required when throughputMode is provisioned)
                type: number
                minimum: 1
                maximum: 3414
              encrypted:
                description: Enable encryption at rest for the EFS filesystem
                type: boolean
                default: true
              kmsKeyId:
                description: KMS key ID or ARN for encryption (uses AWS managed key if not specified)
                type: string
                pattern: '^(arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:(key|alias)/)?[a-zA-Z0-9-/_]+$'
              lifecyclePolicy:
                description: Lifecycle policy for transitioning files to infrequent access storage
                type: string
                enum:
                - AFTER_7_DAYS
                - AFTER_14_DAYS
                - AFTER_30_DAYS
                - AFTER_60_DAYS
                - AFTER_90_DAYS
                - AFTER_1_DAY
              backupPolicy:
                description: AWS Backup policy status
                type: string
                enum:
                - ENABLED
                - DISABLED
                default: ENABLED
              cleanupPolicy:
                description: Cleanup policy when namespace is deleted
                type: string
                enum:
                - retain
                - delete
                default: retain
              mountTargets:
                description: Mount targets configuration for the EFS filesystem
                type: object
                properties:
                  subnetIds:
                    description: List of subnet IDs for creating mount targets
                    type: array
                    items:
                      type: string
                      pattern: '^subnet-[0-9a-f]{8,40}$'
                  securityGroupIds:
                    description: List of security group IDs for mount targets
                    type: array
                    items:
                      type: string
                      pattern: '^sg-[0-9a-f]{8,40}$'
                  ipAddresses:
                    description: Optional IP addresses for mount targets
                    type: array
                    items:
                      type: string
                      pattern: '^((25[0-5]|(2[0-4]|1\d|[1-9]|)\d)\.?\b){4}$'
              tags:
                description: AWS tags to apply to the EFS filesystem
                type: object
                additionalProperties:
                  type: string
                  maxLength: 256
              accessPoints:
                description: List of access points associated with this namespace
                type: array
                items:
                  type: object
                  properties:
                    accessPointId:
                      description: AWS EFS Access Point ID
                      type: string
                      pattern: '^fsap-[0-9a-f]{8,40}$'
                    pvcName:
                      description: Name of the PVC this access point is for
                      type: string
                    pvcNamespace:
                      description: Namespace of the PVC
                      type: string
                    path:
                      description: Path within the EFS filesystem
                      type: string
                    posixUser:
                      description: POSIX user configuration
                      type: object
                      properties:
                        uid:
                          type: integer
                          minimum: 0
                          maximum: 4294967295
                        gid:
                          type: integer
                          minimum: 0
                          maximum: 4294967295
                        secondaryGids:
                          type: array
                          items:
                            type: integer
                            minimum: 0
                            maximum: 4294967295
                    rootDirectory:
                      description: Root directory configuration
                      type: object
                      properties:
                        path:
                          type: string
                        creationInfo:
                          type: object
                          properties:
                            ownerUid:
                              type: integer
                              minimum: 0
                              maximum: 4294967295
                            ownerGid:
                              type: integer
                              minimum: 0
                              maximum: 4294967295
                            permissions:
                              type: string
                              pattern: '^[0-7]{3,4}$'
          status:
            description: EFSNamespaceStatus defines the observed state of EFSNamespace
            type: object
            properties:
              state:
                description: Current state of the EFS namespace mapping
                type: string
                enum:
                - Provisioning
                - Active
                - Updating
                - Deleting
                - Failed
                - Unknown
              fileSystemId:
                description: The actual EFS filesystem ID in use
                type: string
                pattern: '^fs-[0-9a-f]{8,40}$'
              fileSystemArn:
                description: The ARN of the created EFS filesystem
                type: string
              mountTargets:
                description: List of mount targets created for this filesystem
                type: array
                items:
                  type: object
                  properties:
                    mountTargetId:
                      description: Mount target ID
                      type: string
                      pattern: '^fsmt-[0-9a-f]{8,40}$'
                    availabilityZone:
                      description: Availability zone of the mount target
                      type: string
                    subnetId:
                      description: Subnet ID of the mount target
                      type: string
                      pattern: '^subnet-[0-9a-f]{8,40}$'
                    ipAddress:
                      description: IP address of the mount target
                      type: string
                    networkInterfaceId:
                      description: Network interface ID
                      type: string
                      pattern: '^eni-[0-9a-f]{8,40}$'
                    lifecycleState:
                      description: Lifecycle state of the mount target
                      type: string
                      enum:
                      - creating
                      - available
                      - updating
                      - deleting
                      - deleted
                      - error
              accessPointCount:
                description: Number of access points created for this namespace
                type: integer
                minimum: 0
              lastUpdated:
                description: Last time this resource was updated
                type: string
                format: date-time
              message:
                description: Human-readable message indicating details about current state
                type: string
                maxLength: 32768
              conditions:
                description: Conditions represent the latest available observations of the EFSNamespace state
                type: array
                items:
                  type: object
                  required:
                  - type
                  - status
                  properties:
                    type:
                      description: Type of condition
                      type: string
                      enum:
                      - Ready
                      - Provisioning
                      - Progressing
                      - Degraded
                      - Error
                    status:
                      description: Status of the condition (True, False, Unknown)
                      type: string
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status to another
                      type: string
                      format: date-time
                    reason:
                      description: Machine-readable reason for the condition's last transition
                      type: string
                      maxLength: 1024
                    message:
                      description: Human-readable message indicating details about the transition
                      type: string
                      maxLength: 32768
              observedGeneration:
                description: ObservedGeneration reflects the generation most recently observed
                type: integer
                format: int64
    additionalPrinterColumns:
    - name: Namespace
      type: string
      description: The Kubernetes namespace
      jsonPath: .spec.namespace
    - name: FileSystem
      type: string
      description: EFS filesystem ID
      jsonPath: .status.fileSystemId
    - name: State
      type: string
      description: Current state
      jsonPath: .status.state
    - name: AccessPoints
      type: integer
      description: Number of access points
      jsonPath: .status.accessPointCount
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    subresources:
      status: {}
  scope: Namespaced
  names:
    plural: efsnamespaces
    singular: efsnamespace
    kind: EFSNamespace
    shortNames:
    - efsns
    categories:
    - storage
    - efs
    - csi