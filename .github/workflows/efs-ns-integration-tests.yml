name: EFS Namespace Integration Tests

on:
  push:
    branches: [ master, feat/efs-ns ]
    paths:
      - 'pkg/**'
      - 'test/integration/**'
      - 'cmd/**'
      - 'charts/**'
      - 'deploy/**'
      - 'scripts/run-efs-ns-integration-tests.sh'
      - '.github/workflows/efs-ns-integration-tests.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'pkg/**'
      - 'test/integration/**'
      - 'cmd/**'
      - 'charts/**'
      - 'deploy/**'
      - 'scripts/run-efs-ns-integration-tests.sh'
      - '.github/workflows/efs-ns-integration-tests.yml'
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suites:
        description: 'Test suites to run (comma-separated)'
        required: false
        default: 'all'
        type: string
      verbose:
        description: 'Enable verbose output'
        required: false
        default: false
        type: boolean
      fail_fast:
        description: 'Stop on first failure'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write
  actions: read
  id-token: write  # Required for OIDC authentication to AWS

env:
  AWS_REGION: us-west-2
  GO_VERSION: '1.24'

jobs:
  # Pre-flight checks and validation
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      should-run-tests: ${{ steps.check.outputs.should-run-tests }}
      test-suites: ${{ steps.check.outputs.test-suites }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check if tests should run
        id: check
        run: |
          # Always run on schedule and workflow_dispatch
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should-run-tests=true" >> $GITHUB_OUTPUT
          else
            # For push/PR, check if relevant files changed
            if git diff --name-only ${{ github.event.before }}..${{ github.sha }} | grep -E '(pkg/|test/integration/|cmd/|scripts/run-efs-ns-integration-tests.sh)'; then
              echo "should-run-tests=true" >> $GITHUB_OUTPUT
            else
              echo "should-run-tests=false" >> $GITHUB_OUTPUT
            fi
          fi
          
          # Determine test suites
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.test_suites }}" == "all" ]]; then
              echo "test-suites=system,performance,security,reliability,monitoring,compliance" >> $GITHUB_OUTPUT
            else
              echo "test-suites=${{ github.event.inputs.test_suites }}" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            # Full test suite for scheduled runs
            echo "test-suites=system,performance,security,reliability,monitoring,compliance" >> $GITHUB_OUTPUT
          else
            # Quick smoke tests for PR/push
            echo "test-suites=system,compliance" >> $GITHUB_OUTPUT
          fi

      - name: Validate test scripts
        run: |
          # Check script syntax
          bash -n scripts/run-efs-ns-integration-tests.sh
          bash -n scripts/cleanup-efs-ns-test-resources.sh
          
          # Check for required tools
          go version
          kubectl version --client
          
          # Validate test packages exist
          for suite in system performance security reliability monitoring compliance; do
            if [[ ! -d "test/integration/$suite" ]]; then
              echo "::error::Test suite directory not found: test/integration/$suite"
              exit 1
            fi
          done

      - name: Build test binaries
        run: |
          # Build main driver
          make
          
          # Validate test packages compile
          go test -c ./test/integration/system
          go test -c ./test/integration/compliance

  # Unit and component tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.should-run-tests == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run unit tests
        run: |
          make test

      - name: Run verification checks
        run: |
          make verify

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage.out
          flags: unittests
          name: unit-tests

  # Integration tests in AWS environment
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [preflight, unit-tests]
    if: needs.preflight.outputs.should-run-tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Core Integration"
            suites: "system,compliance"
            timeout: "1800"  # 30 minutes
          - name: "Performance & Security"  
            suites: "performance,security"
            timeout: "2400"  # 40 minutes
          - name: "Reliability & Monitoring"
            suites: "reliability,monitoring" 
            timeout: "3600"  # 60 minutes
    env:
      KUBECONFIG: /tmp/kubeconfig
      EFS_NS_TEST_TIMEOUT: ${{ matrix.timeout }}
      EFS_NS_PARALLEL_TESTS: 4
      EFS_NS_VERBOSE: ${{ github.event.inputs.verbose || 'false' }}
      EFS_NS_FAIL_FAST: ${{ github.event.inputs.fail_fast || 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INTEGRATION_TEST_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: EFSNSIntegrationTests

      - name: Set up test cluster
        id: cluster
        run: |
          # Create or use existing test EKS cluster
          CLUSTER_NAME="efs-ns-integration-test-$(date +%s)"
          echo "cluster-name=${CLUSTER_NAME}" >> $GITHUB_OUTPUT
          
          # For now, assume cluster exists - in real implementation would create/configure cluster
          # aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME
          echo "Using mock cluster configuration for demonstration"

      - name: Set up test EFS filesystem
        id: efs
        run: |
          # Create or use existing test EFS filesystem
          EFS_ID=$(aws efs create-file-system \
            --performance-mode generalPurpose \
            --throughput-mode provisioned \
            --provisioned-throughput-in-mibps 100 \
            --tags Key=Name,Value=efs-ns-integration-test Key=efs-ns-test,Value=true \
            --query 'FileSystemId' \
            --output text)
          
          echo "efs-id=${EFS_ID}" >> $GITHUB_OUTPUT
          echo "EFS_NS_TEST_EFS_ID=${EFS_ID}" >> $GITHUB_ENV
          
          # Wait for EFS to be available
          aws efs wait file-system-available --file-system-id $EFS_ID

      - name: Install AWS EFS CSI Driver
        run: |
          # Install the driver with namespace support
          kubectl apply -k deploy/kubernetes/overlays/dev/
          
          # Wait for driver to be ready
          kubectl wait --for=condition=available --timeout=300s deployment/efs-csi-controller -n kube-system
          kubectl wait --for=condition=ready --timeout=300s daemonset/efs-csi-node -n kube-system

      - name: Run integration tests
        id: tests
        run: |
          # Determine test suites to run
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TEST_SUITES="${{ needs.preflight.outputs.test-suites }}"
          else
            TEST_SUITES="${{ matrix.suites }}"
          fi
          
          # Run the comprehensive test suite
          ./scripts/run-efs-ns-integration-tests.sh \
            --suites "$TEST_SUITES" \
            --timeout "${{ matrix.timeout }}" \
            --parallel 4 \
            $([ "${{ env.EFS_NS_VERBOSE }}" == "true" ] && echo "--verbose") \
            $([ "${{ env.EFS_NS_FAIL_FAST }}" == "true" ] && echo "--fail-fast")

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-reports-${{ matrix.name }}
          path: test-reports/
          retention-days: 30

      - name: Parse test results
        if: always()
        run: |
          # Parse test results for GitHub Actions
          if [[ -d test-reports/ ]]; then
            latest_report=$(find test-reports/ -name "test-summary.json" -type f | sort | tail -1)
            if [[ -f "$latest_report" ]]; then
              success_rate=$(jq -r '.success_rate' "$latest_report")
              passed_suites=$(jq -r '.passed_suites' "$latest_report")
              total_suites=$(jq -r '.total_suites' "$latest_report")
              
              echo "::notice title=Test Results::$passed_suites/$total_suites test suites passed ($success_rate%)"
              
              # Set job status based on results
              if [[ "$passed_suites" == "$total_suites" ]]; then
                echo "All test suites passed successfully"
              else
                echo "::error title=Test Failures::Some test suites failed"
                exit 1
              fi
            fi
          fi

      - name: Cleanup resources
        if: always()
        run: |
          # Always cleanup, even if tests failed
          ./scripts/cleanup-efs-ns-test-resources.sh --timeout 300
          
          # Cleanup EFS filesystem if we created it
          if [[ -n "${{ steps.efs.outputs.efs-id }}" ]]; then
            aws efs delete-file-system --file-system-id "${{ steps.efs.outputs.efs-id }}" || true
          fi

  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.should-run-tests == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run gosec security scanner
        run: |
          go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out gosec-results.sarif -stdout -verbose=text ./...

      - name: Upload gosec scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'gosec-results.sarif'

  # Performance benchmarking
  performance-benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: [preflight, unit-tests]
    if: needs.preflight.outputs.should-run-tests == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Go benchmarks
        run: |
          go test -bench=. -benchmem -benchtime=30s ./pkg/... > benchmark-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.txt

  # Final status check and reporting
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [preflight, unit-tests, integration-tests, security-scan]
    if: always() && needs.preflight.outputs.should-run-tests == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Generate comprehensive report
        run: |
          echo "# EFS Namespace Integration Test Summary" > test-summary.md
          echo "" >> test-summary.md
          echo "**Date:** $(date -Iseconds)" >> test-summary.md
          echo "**Commit:** ${{ github.sha }}" >> test-summary.md
          echo "**Branch:** ${{ github.ref_name }}" >> test-summary.md
          echo "" >> test-summary.md
          
          # Aggregate results from all jobs
          echo "## Job Results" >> test-summary.md
          echo "- Unit Tests: ${{ needs.unit-tests.result }}" >> test-summary.md
          echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> test-summary.md
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> test-summary.md
          
          # Add artifact links if available
          if [[ -d artifacts/ ]]; then
            echo "" >> test-summary.md
            echo "## Test Artifacts" >> test-summary.md
            find artifacts/ -name "*.json" -o -name "*.txt" | head -10 | while read -r file; do
              echo "- $(basename "$file")" >> test-summary.md
            done
          fi

      - name: Post results to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('test-summary.md')) {
              const summary = fs.readFileSync('test-summary.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            }

      - name: Final status check
        run: |
          # Check overall success based on all job results
          if [[ "${{ needs.unit-tests.result }}" == "success" && 
                "${{ needs.integration-tests.result }}" == "success" && 
                "${{ needs.security-scan.result }}" == "success" ]]; then
            echo "All tests passed successfully!"
            exit 0
          else
            echo "Some tests failed. Check individual job results for details."
            exit 1
          fi